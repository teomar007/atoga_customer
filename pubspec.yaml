name: atoga_customer
description: "ATOGA MARKET - Customer app for fast grocery shopping (Android & iOS)."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Backend (Supabase)
  supabase_flutter: ^2.9.0
  # استيراد صريحين: نحتاج أصناف الاستثناءات للتحويل إلى رسائل واضحة
  gotrue: ^2.27.2
  postgrest: ^2.9.1

  # Local storage (cart cache + tokens + preferences)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # Maps & Location
  geolocator: ^13.0.4
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Connectivity (offline states)
  connectivity_plus: ^6.1.0

  # Push notifications (OneSignal)
  # إشعارات Firebase المباشرة (بديل OneSignal المجاني)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.1
  http: ^1.6.0
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
